<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cuestionario</title>
  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <main class="caja">
    <header class="info" id="info"></header>

    <section id="zona-preguntas">
      <p id="numero"></p>
      <h2 id="pregunta"></h2>
      <div>
        <input type="radio" name="option" id="r1">
        <label id="alt1" for="r1"></label>
      </div>

      <div>
        <input type="radio" name="option" id="r2">
        <label id="alt2" for="r2"></label>
      </div>

      <div>
        <input type="radio" name="option" id="r3">
        <label id="alt3" for="r3"></label>
      </div>

      <br>
      <button type="button" id="anterior">Anterior</button>
      <button type="button" id="siguiente">Siguiente</button>
    </section>
  </main>
  <script>

    // CONSTRUIR UN CUESTIONARIO (5 interrogantes) 
    // Pregunta 
    // 3 alternativas 
    // Utilizar botones de desplazamiento para la navegación 
    // Los datos que se irán mostrando  deben estar en un OBJETO
    // (cada pregunta es un objeto)

    const cuestionario = {
      titulo: "Evaluación de Programación",
      instructor: "Susana Atuncar Pasache",
      nivel: "Fácil",
      contenido: [
        {
          pregunta: "¿Qué palabra se usa para declarar una variable que cambia de valor?",
          alternativas: ["const", "let", "split"]
        },
        {
          pregunta: "¿Qué método de las cadenas devuelve un array?",
          alternativas: ["concat", "repeat", "split"]
        },
        {
          pregunta: "¿Qué evento se produce al pulsar un botón?",
          alternativas: ["click", "focus", "change"]
        },
        {
          pregunta: "¿Cómo se define un objeto en JavaScript?",
          alternativas: ["Con corchetes []", "Con llaves {}", "Con paréntesis ()"]
        },
        {
          pregunta: "¿Qué método se usa para agregar un evento a un elemento?",
          alternativas: ["getElementById", "addEventListener", "innerHTML"]
        }
      ]
    }


    let i = 0
    const info = document.getElementById("info")
    const numero = document.getElementById("numero")
    const pregunta = document.getElementById("pregunta")
    const alt1 = document.getElementById("alt1")
    const alt2 = document.getElementById("alt2")
    const alt3 = document.getElementById("alt3")
    const btnAnterior = document.getElementById("anterior")
    const btnSiguiente = document.getElementById("siguiente")

    info.innerHTML = cuestionario.titulo + " - " + cuestionario.instructor + " (" + cuestionario.nivel + ")"

    function mostrarPregunta() {
      const actual = cuestionario.contenido[i]

      numero.innerHTML = "Pregunta " + (i + 1) + " de " + cuestionario.contenido.length
      pregunta.innerHTML = actual.pregunta
      alt1.innerHTML = actual.alternativas[0]
      alt2.innerHTML = actual.alternativas[1]
      alt3.innerHTML = actual.alternativas[2]

      document.getElementById("r1").checked = false
      document.getElementById("r2").checked = false
      document.getElementById("r3").checked = false
    }

    btnSiguiente.addEventListener("click", function () {
      if (i < cuestionario.contenido.length - 1) {
        i = i + 1

        mostrarPregunta()
      }
    })

    btnAnterior.addEventListener("click", function () {
      if (i > 0) {
        i = i - 1
        mostrarPregunta()
      }
    })

    mostrarPregunta()

  </script>
</body>

</html>
