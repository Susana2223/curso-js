<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button type="button" id="mensaje">Mensaje</button>
  <input type="text" id="caja">

  <script>
    //propiedad. caracteristicas objetos(nombre, ubicación, color)
    //Método: acciones (verbo infinitivos)
    //Evento: respuesta (clic, arrastrar)

    //E1: Al cargar la página
    //DOM : contenido de la página | Documento Object Model
    document.addEventListener("DOMContentLoaded", function (){
      console.log("DOM fue cargado completamente...")

      const boton = document.getElementById("mensaje")
      //E2: Clic (pulsar el botón)
      boton.addEventListener("click", function (){
        console.log("Hola mundo desde JS")
      })

      //¿Qué significa addEventListener?
      //agregar evento de escucha/atención
      //E3: focus(enfoque)

      const contenido = document.getElementById("caja")
      contenido.addEventListener("focus", function(){
        console.log("Elemento activo la caja")
      })
     
    })
  </script>
</body>
</html>
