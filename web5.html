<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
  >
</head>
<body>
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-half">

          <form class="box" action="" autocomplete="off" id="formulario">

            <div class="field">
              <label class="label" for="apellidos">Apellidos</label>
              <div class="control">
                <input type="text" class="input" id="apellidos" minlength="3" required>
              </div>
            </div>

            <div class="field">
              <label class="label" for="nombres">Nombres</label>
              <div class="control">
                <input type="text" class="input" id="nombres" minlength="3" required>
              </div>
            </div>

            <div class="field">
              <label class="label" for="fechanac">Fecha nacimiento</label>
              <div class="control">
                <input type="date" class="input" id="fechanac" min="1990-12-31" max="2026-10-26" required>
              </div>
            </div>

            <div class="field">
              <label class="label" for="email">Correo electrónico</label>
              <div class="control">
                <input type="email" class="input" id="email" required>
              </div>
            </div>

            <div class="field">
              <label class="label" for="experiencia">Experiencia:</label>
              <div class="control">
                <input type="number" class="input" id="experiencia" min="0" max="30" value="1" required>
              </div>
            </div>

            <div class="field">
              <label class="label" for="cargo">Cargo</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select class="select" name="cargo" id="cargo" required>
                    <option value="">Seleccione</option>
                    <option value="1">Analista</option>
                    <option value="2">Programador</option>
                    <option value="3">Jefe</option>
                  </select>
                </div>
              </div>
            </div>

            <div>
              <button class="button is-link" type="submit">Enviar</button>
              <button class="button" type="reset">Reiniciar</button>
            </div>

          </form>

        </div>
      </div>
    </div>
  </section>

  <script>
    // Detenemos el evento submit (envío).
    // El evento submit está asociado al formulario y NO al botón.
    const formulario = document.getElementById("formulario")

    formulario.addEventListener("submit", function (event) {
      event.preventDefault()

      if (confirm("¿Está seguro de proceder?")) {
        alert("Guardado correctamente...")
      }
    })
  </script>
</body>
</html>
